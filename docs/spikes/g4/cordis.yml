# G4 spike cordis.yml —— 在 G1 组合上增加 skills，验证 skills + 合规 prompt 模型可见性。
# 与 G1 的差异：加 skill-filesystem（提供者，指向 desk/skills）+ tool-skill（模型可见的 skill 工具与目录）。
# 合规 prompt 由 agent-spine 的 persona 承载（spike 简化；正式版走 desk 的 systemPrompt.section）。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是 AlphaCopilot 投研助理。硬性规则：不推荐任何具体买卖、不预测涨跌与价位、不给买卖时机、不承诺收益、不打分排名。只做信息整理与多视角分析。'
    workspaceContext: false
    skills:
      enabled: true
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# —— skills：提供者 + 模型可见的 skill 工具与目录 ——
- id: skill-fs
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.env.G4_SKILLS_DIR]"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# —— 我们的 MCP server ——
- id: mcp-research
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: research
    transport: stdio
    command: !!js process.env.G1_MCP_PY
    args: !!js "[process.env.G1_MCP_SERVER]"
    failOnStartupError: true
