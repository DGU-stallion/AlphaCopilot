# G1 spike cordis.yml —— 验证 Python SDK + 自写组合能挂载我们的 MCP server。
# 基于 deepseek-harness/examples/jsonrpc-agent/cordis.yml 结构，增加一个 mcp-client
# 实例指向 docs/spikes/g1/mcp_server_min.py。
# stdout 保留给 JSON-RPC；不加 console logger / 终端 UI。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are AlphaCopilot, a quant research assistant. Use the provided MCP tools to fetch market data. Never give buy/sell advice.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# —— 我们的 MCP server：把 get_quote 注册为模型可见工具 ——
# 模型看到的工具名：mcp__research__get_quote
- id: mcp-research
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: research
    transport: stdio
    command: !!js process.env.G1_MCP_PY
    args: !!js "[process.env.G1_MCP_SERVER]"
    failOnStartupError: true
