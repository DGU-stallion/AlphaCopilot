[project]
name = "dsh-alphacopilot-research"
version = "0.1.0"
description = "AlphaCopilot research data as MCP tools + REST (stdio server registered by dsh-alphacopilot-research-bridge)"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x 把 FastMCP 改名为 MCPServer；spike 固化在 v1 API，T08 再评估迁移
    "mcp>=1.9,<2",
    # 对本地数据层的引用 —— T08 落地时二选一：
    #   开发期: pip install -e ../../backend（spike 现状，server.py 另有 sys.path 兜底）
    #   发布期: alphacopilot-research @ git+https://github.com/DGU-stallion/AlphaCopilot@archive-v0.3
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# 运行：python -m alphacopilot_research.server（stdio transport）
[project.scripts]
alphacopilot-research-server = "alphacopilot_research.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["alphacopilot_research", "alphacopilot_research.tools"]
