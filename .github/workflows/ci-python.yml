name: ci-python

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-python.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-python.yml"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (library)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . 
          pip install ruff pyright pytest
      - name: Ruff
        run: ruff check backend
      - name: Pyright (basic)
        working-directory: backend
        run: pyright
      - name: Pytest
        run: pytest backend/tests -q
