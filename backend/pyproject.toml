[project]
name = "alphacopilot"
version = "0.2.0"
description = "AlphaCopilot — 对话驱动的量化投研工作台：research 数据层 + alpha 分析库 + api 会话编排 + agent(dsh 适配) + mcp 工具层。"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "jsonschema>=4.0",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
# Heavy optional sources; absent deps degrade gracefully at call time.
full = [
    "akshare>=1.10",
    "mootdx>=0.10",
    "pandas>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pandas>=2.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research", "alpha", "api", "agent", "mcpserver"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research/caches.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 遗留库代码冻结区：中文注释/文档串超长行不重排；astock 闭包捕获模式维持原样。
"research/**" = ["E501"]
"research/astock.py" = ["E501", "B023"]
"agent/persona.py" = ["E501"]

[tool.pyright]
include = ["research", "alpha", "api", "agent", "mcpserver"]
exclude = ["research/caches.py"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
