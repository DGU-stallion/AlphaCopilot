[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphacopilot-backend"
version = "0.2.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*", "research*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.toml", "*.md"]
