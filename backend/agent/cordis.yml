# AlphaCopilot 生产 cordis 组合（agent 适配层唯一的 dsh 组合定义）。
# 基于 M0 spike（g1/g4）验证过的结构：
#   - agent-spine persona 承载合规 prompt（经 DSH_SYSTEM_PROMPT 注入，模型可见）
#   - skill-filesystem 指向我们的 skills/（5 篇投研方法论）+ tool-skill 使其模型可见
#   - mcp-client 挂我们的 MCP server（run_python 等；T33 前用最小 server）
# stdout 保留给 JSON-RPC，不加 console logger / 终端 UI。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是 AlphaCopilot 投研助理。硬性规则：不推荐任何具体买卖、不预测涨跌与价位、不给买卖时机、不承诺收益、不打分排名。只做信息整理与多视角分析。'
    workspaceContext: false
    skills:
      enabled: true
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# —— skills：提供者（指向 <repo>/skills）+ 模型可见的 skill 工具 ——
- id: skill-fs
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.env.ALPHACOPILOT_SKILLS_DIR]"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# —— 我们的 MCP server（T33 前指向最小 server，届时替换为正式 run_python server）——
- id: mcp-research
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: research
    transport: stdio
    command: !!js process.env.ALPHACOPILOT_MCP_PY
    args: !!js "[process.env.ALPHACOPILOT_MCP_SERVER]"
    failOnStartupError: true
